name: auto-update from upstream pstack

on:
  schedule:
    # Mon/Wed/Fri ~03:20 UTC. Spread from the hour to dodge scheduler contention.
    - cron: "20 3 * * 1,3,5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream cursor/plugins
        run: |
          git remote add upstream https://github.com/cursor/plugins.git
          git fetch upstream main --depth 1

      - name: Run the lever
        run: |
          git config user.name "pstack-omp-bot"
          git config user.email "pstack-omp-bot@users.noreply.github.com"
          bash scripts/update.sh

      - name: Push if the lever produced a commit
        run: |
          if [ -n "$(git log origin/master..HEAD --oneline 2>/dev/null)" ]; then
            git push origin master
            echo "pushed: $(git log -1 --oneline)"
          else
            echo "no changes; nothing to push"
          fi

